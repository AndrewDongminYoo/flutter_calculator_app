name: calculator

concurrency:
  group: $-$
  cancel-in-progress: true

permissions: read-all

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    if: ${{ !contains(fromJSON('["dependabot[bot]", "renovate[bot]", "snyk-bot", "allcontributors[bot]"]'), github.actor) }}
    defaults:
      run:
        working-directory: .

    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout with Submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐦 Setup Flutter
        uses: AndrewDongminYoo/merry-setup@874b91d59e81270c32242743235261b06ae1fce8 # v1.0.0
        with:
          sdk: flutter
          cache: true
          merry: false
          dart-packages: very_good_cli
          bootstrap: flutter

      - name: ✨ Check Formatting
        run: dart format --set-exit-if-changed lib test

      - name: 🕵️ Analyze
        run: flutter analyze lib test

      - name: 🧪 Run Tests
        run: very_good test -j 4 --no-optimization --coverage --test-randomize-ordering-seed random

      - name: 🎯 Filter Coverage Files
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          lcov --remove coverage/lcov.info "**/*.g.dart" -o coverage/lcov_filtered.info --ignore-errors unused

      - name: 📈 Upload filtered coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov_filtered.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
          verbose: true

  spell-check:
    if: ${{ !contains(fromJSON('["dependabot[bot]", "renovate[bot]", "snyk-bot", "allcontributors[bot]"]'), github.actor) }}
    defaults:
      run:
        working-directory: .

    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🪄 Spell Check
        uses: streetsidesoftware/cspell-action@e0668cf020899e887ee8ad4d173c31738a79eae8 # v9.0.1
        with:
          incremental_files_only: false
          root: .
          verbose: false
