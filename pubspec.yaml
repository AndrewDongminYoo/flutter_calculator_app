name: calculator
description: A Very Good Project created by Very Good CLI.
version: 1.0.1+1
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: ^3.47.8

dependencies:
  auto_size_text: ^3.0.0
  bloc: ^9.2.1
  connectivity_plus: ^7.3.2
  cupertino_ui: ^1.1.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.5.0
  freezed_annotation: ^3.1.0
  material_ui: ^1.11.1
  math_expressions: ^3.2.0
  vector_graphics: ^1.3.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.2
  connectivity_plus_platform_interface: ^2.1.0
  flutter_gen_runner: ^5.15.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  import_sorter: ^4.6.0
  mockito: ^5.8.1
  very_good_analysis: ^11.0.0

import_sorter:
  emojis: true

# https://github.com/AndrewDongminYoo/merry
# `dart pub global activate merry`
scripts: merry.yaml

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/svgs/

  fonts:
    - family: SFProDisplay
      # https://developer.apple.com/fonts/
      fonts:
        - asset: assets/fonts/SFProDisplay_Bold.otf
          weight: 700
        - asset: assets/fonts/SFProDisplay_Medium.otf
          weight: 500
        - asset: assets/fonts/SFProDisplay_Regular.otf
          weight: 400

  config:
    enable-android: true
    enable-ios: true
    enable-macos-desktop: true
    enable-web: true
    cli-animations: false
    enable-swift-package-manager: true

# https://pub.dev/packages/flutter_gen_runner
flutter_gen:
  line_length: 120 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true
